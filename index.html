<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Panel de Control</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; padding: 15px; color: white; }
    
    /* Barra de botones */
    .bar { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; align-items: center; }
    .btn { padding: 10px 16px; background: #2563eb; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 14px; transition: background 0.2s; border: none; cursor: pointer; display: inline-block; }
    .btn:hover { background: #1d4ed8; }
    .btn-green { background: #059669; }
    .btn-green:hover { background: #047857; }
    .btn-purple { background: #7c3aed; }
    .btn-purple:hover { background: #6d28d9; }
    
    /* Ventana del tablero (Intacta como en tu código funcional) */
    iframe { width: 100%; height: 85vh; border: none; border-radius: 8px; background: white; }

    /* ESTILOS EXCLUSIVOS DEL POPUP (Totalmente independientes) */
    #miModal {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.8); z-index: 99999; justify-content: center; align-items: center;
    }
    #contenidoModal {
      background: #1e293b; width: 90vw; height: 90vh; border-radius: 8px;
      display: flex; flex-direction: column; overflow: hidden;
    }
    #cabeceraModal {
      padding: 10px 15px; background: #0f172a; display: flex; justify-content: space-between; align-items: center;
    }
    #iframeModal {
      width: 100%; height: 100%; border: none; background: white;
    }
    .btn-cerrar {
      background: #ef4444; color: white; border: none; padding: 5px 12px; border-radius: 4px; font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- TUS BOTONES -->
  <div class="bar">
    <!-- Botón para el PopUp de Looker Studio -->
    <button class="btn btn-purple" onclick="abrirPopup('DASHBOARD TRELLO', 'https://datastudio.google.com/embed/reporting/6bdf0f27-6a30-4ce9-a07a-e4e47be123cc/page/xXU9F')">📈 Dashboard</button>

    <!-- Tu botón anterior de Google Sheets -->
    <button class="btn btn-green" onclick="abrirPopup('REPORTE DIARIO SVR', 'https://docs.google.com/spreadsheets/d/1l1gG1uenvvIn953fAWBPPwvzKWflzWWqLCoH_Z_K5s0/preview')">📊 REPORTE DIARIO SVR</button>

    <!-- Botones tradicionales -->
    <a href="https://drive.google.com" target="_blank" class="btn">📁 Google Drive</a>
    <a href="https://script.google.com/macros/s/AKfycbz_tpQFQVz2KWUaGv4xeEllR_Gjurtc0HMYhNyZ0q2l0TmHPYLQozI8c02HH0lYyORp0A/exec" target="_blank" class="btn">✉️ ESTADO SUBIR</a>
    <a href="https://drive.google.com/file/d/1UhRi7UhaGKdzY8iFKg4auvCT172T37FS/view?usp=sharing" target="_blank" class="btn">💵 Cotizador Aclin</a>
    <a href="https://script.google.com/macros/s/AKfycbwAon4_ckWEuqukCQaFUI1X2fq-sdRqzEEDeD4BXvJVzYxvvL3U7TjPQlm_JZt8hZFD/exec" target="_blank" class="btn">✈️ Vacaciones Simulador</a>
    <a href="https://drive.google.com/file/d/1UhRi7UhaGKdzY8iFKg4auvCT172T37FS/view?usp=sharing" target="_blank" class="btn">🔍  Buscador productos</a>
  </div>

  <!-- TU TABLERO DE TRELLO (Tal cual como te funciona) -->
  <iframe src="https://trello.com/b/1TmQvZOd.html"></iframe>

  <!-- VENTANA POPUP OCULTA -->
  <div id="miModal">
    <div id="contenidoModal">
      <div id="cabeceraModal">
        <span id="tituloModal" style="font-weight:bold;">Documento</span>
        <button class="btn-cerrar" onclick="cerrarPopup()">✕ Cerrar</button>
      </div>
      <iframe id="iframeModal" src=""></iframe>
    </div>
  </div>

  <!-- SCRIPT LIGERO PARA EL POPUP -->
  <script>
    function abrirPopup(titulo, url) {
      document.getElementById('tituloModal').innerText = titulo;
      document.getElementById('iframeModal').src = url;
      document.getElementById('miModal').style.display = 'flex';
    }

    function cerrarPopup() {
      document.getElementById('miModal').style.display = 'none';
      document.getElementById('iframeModal').src = '';
    }

    // Cerrar con la tecla ESC
    document.addEventListener('keydown', function(e) {
      if (e.key === "Escape") cerrarPopup();
    });
  </script>

</body>
</html>
