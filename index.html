<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Panel de Control</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; padding: 15px; color: white; }
    
    /* Barra de botones */
    .bar { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; align-items: center; }
    .btn { padding: 10px 16px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: background 0.2s; }
    .btn:hover { background: #1d4ed8; }
    .btn-green { background: #059669; }
    .btn-green:hover { background: #047857; }
    
    /* Ventana del tablero Trello */
    iframe.trello-frame { width: 100%; height: 85vh; border: none; border-radius: 8px; background: white; }

    /* Estilos del Popup / Modal */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px);
      z-index: 1000; justify-content: center; align-items: center;
    }
    .modal-content {
      background: #1e293b; width: 90%; height: 90%; border-radius: 12px;
      display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .modal-header {
      padding: 12px 20px; background: #0f172a; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155;
    }
    .modal-header h3 { font-size: 16px; color: #f8fafc; }
    .close-btn { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .close-btn:hover { background: #dc2626; }
    .modal-body { flex: 1; }
    .modal-body iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <!-- BARRA DE BOTONES -->
  <div class="bar">
    <button class="btn btn-green" onclick="openModal('REPORTE DIARIO SVR', 'https://docs.google.com/spreadsheets/d/1l1gG1uenvvIn953fAWBPPwvzKWflzWWqLCoH_Z_K5s0/preview')">📊 REPORTE DIARIO SVR</button>
    <a href="https://mail.google.com" target="_blank" class="btn">✉️ Gmail</a>
  </div>

  <!-- TABLERO DE TRELLO (Con .html al final para autorizar el iframe) -->
  <iframe class="trello-frame" src="https://trello.com/b/1TmQvZOd.html"></iframe>

  <!-- VENTANA EMERGENTE (POPUP) -->
  <div id="driveModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">Documento Drive</h3>
        <button class="close-btn" onclick="closeModal()">✕ Cerrar</button>
      </div>
      <div class="modal-body">
        <iframe id="driveFrame" src=""></iframe>
      </div>
    </div>
  </div>

  <!-- SCRIPT PARA CONTROLAR EL POPUP -->
  <script>
    function openModal(title, url) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('driveFrame').src = url;
      document.getElementById('driveModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('driveModal').style.display = 'none';
      document.getElementById('driveFrame').src = '';
    }

    document.addEventListener('keydown', function(event) {
      if (event.key === "Escape") { closeModal(); }
    });
  </script>

</body>
</html>
